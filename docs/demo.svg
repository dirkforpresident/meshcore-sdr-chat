<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14.5">
  <defs>
    <clipPath id="win"><rect x="0" y="0" width="820" height="470" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
    <rect x="0" y="0" width="820" height="470" fill="#1e2127"/>
    <!-- title bar -->
    <rect x="0" y="0" width="820" height="30" fill="#2b2f36"/>
    <circle cx="20" cy="15" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="15" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="15" r="6" fill="#27c93f"/>
    <text x="410" y="20" text-anchor="middle" fill="#8b909a" font-size="13">meshcore-sdr-chat — meshchat.py --name notsure --scope hansemesh</text>
    <!-- status bar (reversed) -->
    <rect x="0" y="38" width="820" height="24" fill="#cfd3da"/>
    <text x="12" y="55" fill="#1e2127" font-weight="bold">MeshCore SDR  869.618MHz SF8  as notsure  #public -&gt; hansemesh  frames:12</text>
    <!-- chat body (example data) -->
    <text x="12" y="88"  fill="#6b7280">listening on the public channel — type to send, /help for commands</text>
    <text x="12" y="116" fill="#6b7280">20:39:58  · advert: relay-nord [repeater]</text>
    <text x="12" y="144" fill="#6b7280">20:40:02  · advert: alice [chat]</text>
    <text x="12" y="172" fill="#e6e6e6">20:33:37  notsure: Test</text>
    <text x="12" y="200" fill="#56b6c2">20:40:12  #de-nord bob  läuft, 4 Hops</text>
    <text x="12" y="228" fill="#56b6c2">20:41:05  #hansemesh alice  moin aus dem mesh</text>
    <text x="12" y="256" fill="#e6e6e6">20:41:20  notsure: moin, gruss per SDR</text>
    <text x="12" y="284" fill="#98c379">20:41:21  ✓ sent (relay hop1)</text>
    <text x="12" y="312" fill="#56b6c2">20:42:44  #de-nord bob  empfange dich sauber</text>
    <!-- separator -->
    <line x1="0" y1="418" x2="820" y2="418" stroke="#3a3f47" stroke-width="1"/>
    <!-- input line -->
    <text x="12" y="446" fill="#c8ccd4">&gt; /scope de-nord</text>
    <rect x="152" y="433" width="9" height="17" fill="#c8ccd4"/>
  </g>
</svg>
